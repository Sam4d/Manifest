name: Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package*.json"
      - "build/**"
      - ".github/workflows/desktop-build.yml"
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check Windows desktop interactions
        run: npm run test:desktop
      - name: Build installer and portable executable
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: SiteAtlas-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
