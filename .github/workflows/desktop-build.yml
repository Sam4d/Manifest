name: Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package*.json"
      - "build/**"
      - ".github/workflows/desktop-build.yml"
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check Windows desktop interactions
        run: npm run test:desktop
      - name: Build installer and portable executable
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: PageTrace-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct Windows downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          Copy-Item "dist/PageTrace-$version-x64-portable.exe" "dist/PageTrace-Windows-x64.exe"
          $files = @("dist/PageTrace-Windows-x64.exe", "dist/PageTrace-$version-x64-Setup.exe")
          $lines = $files | ForEach-Object { $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(); "$hash  $(Split-Path $_ -Leaf)" }
          $lines | Set-Content dist/SHA256SUMS.txt
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "PageTrace $version" --notes "PageTrace offline website analyzer. White and #00674F emerald light mode, matching dark mode, interactive file inspector, and illustrated documentation. Download PageTrace-Windows-x64.exe to run without installing. Windows x64; unsigned build."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag @files dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
