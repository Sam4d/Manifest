name: Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "test/**"
      - "package*.json"
      - "build/**"
      - ".github/workflows/desktop-build.yml"
concurrency:
  group: pagetrace-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: write
      actions: write
    runs-on: windows-latest
    steps:
      - name: Cancel obsolete Windows test runs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $runs = gh run list --workflow desktop-build.yml --branch main --status in_progress --limit 20 --json databaseId | ConvertFrom-Json
          foreach ($run in $runs) {
            if ([long]$run.databaseId -lt [long]$env:GITHUB_RUN_ID) {
              gh run cancel $run.databaseId
            }
          }
          exit 0
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check Windows desktop interactions
        run: npm run test:desktop
      - name: Check multi-site and rendered capture
        run: npm run test:capture:desktop
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/cache/restore@v4
        id: httrack-cache
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: httrack-3.50.5-release-msvc-vcpkg-${{ runner.os }}
      - name: Build bundled HTTrack from verified source
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-binary-cache
        run: |
          try { ./scripts/build-httrack.ps1 *>&1 | Tee-Object -Variable buildOutput }
          catch {
            "## HTTrack build failed" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            $buildOutput | Select-Object -Last 100 | Out-File $env:GITHUB_STEP_SUMMARY -Append
            $_ | Out-File $env:GITHUB_STEP_SUMMARY -Append
            throw
          }
      - name: Save native dependency cache before integration tests
        if: steps.httrack-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: httrack-3.50.5-release-msvc-vcpkg-${{ runner.os }}
      - name: Test real HTTrack download to reconstruction kit
        run: node scripts/httrack-smoke.cjs vendor/httrack/httrack.exe
      - name: Check automatic HTTrack desktop pipeline
        run: node_modules/.bin/electron scripts/httrack-desktop-smoke.cjs
      - name: Check native capture folder dialog before packaging
        run: node scripts/packaged-smoke.cjs node_modules/electron/dist/electron.exe .
      - name: Build installer and portable executable
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Check engine included in packaged resources
        run: node scripts/httrack-smoke.cjs dist/win-unpacked/resources/httrack/httrack.exe
      - name: Launch and scan using the actual Windows app
        run: node scripts/packaged-smoke.cjs dist/win-unpacked/PageTrace.exe
      - name: Launch and scan using the actual portable download
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/packaged-smoke.cjs "dist/PageTrace-$version-x64-portable.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: PageTrace-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct Windows downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          Copy-Item "dist/PageTrace-$version-x64-portable.exe" "dist/PageTrace-Windows-x64.exe"
          $files = @("dist/PageTrace-Windows-x64.exe", "dist/PageTrace-$version-x64-Setup.exe")
          $lines = $files | ForEach-Object { $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(); "$hash  $(Split-Path $_ -Leaf)" }
          $lines | Set-Content dist/SHA256SUMS.txt
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "PageTrace $version" --notes "Full HTTrack engine capture, automatic essentials export, JSON website schema and SVG page diagram. Includes HTTrack corresponding source and license. Actual native engine and packaged Windows checks gate publication. Download PageTrace-Windows-x64.exe to run without installing. Windows x64; unsigned build."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag @files dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
